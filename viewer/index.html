<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>全国地下水資料台帳 井戸マップ（2003年版）</title>
  <meta name="description" content="国土交通省「全国地下水資料台帳調査」（F9）2003年版の深井戸57,847点を、位置精度で色分けして表示する非公式ビューワ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="井戸マップ" />
</head>
<body>
  <div id="map"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">💧</span>
        <h1>全国地下水資料台帳 井戸マップ<small>2003年版・57,847点</small></h1>
      </div>
      <div class="head-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <div class="field">
        <div class="field-head">
          <span class="field-label">色分け</span>
        </div>
        <div id="themes" class="themes"></div>
        <p id="theme-desc" class="hint"></p>
        <div id="legend" class="legend"></div>
        <p class="hint hint-sub">凡例をクリックするとその区分だけを表示します。</p>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">絞り込み</span>
          <div class="field-actions">
            <button id="filter-reset" class="mini-btn" type="button">リセット</button>
          </div>
        </div>

        <div class="sub-label">位置精度</div>
        <div id="posq-filters" class="checks"></div>
        <p class="hint hint-sub">既定では実位置（単独の座標）だけを表示しています。</p>

        <div class="sub-label">所在地（町名）からの距離</div>
        <div class="range-row">
          <input id="dist-range" type="range" min="0" max="21" step="1" value="21"
                 aria-label="所在地からの距離の上限" />
          <span id="dist-val" class="range-val">制限なし</span>
        </div>
        <label class="check">
          <input id="dist-unknown" type="checkbox" checked />
          <span id="dist-unknown-label">判定不能も表示する</span>
        </label>

        <div class="sub-label">掘削深度の下限</div>
        <div class="range-row">
          <input id="dep-range" type="range" min="0" max="500" step="10" value="0"
                 aria-label="掘削深度の下限" />
          <span id="dep-val" class="range-val">制限なし</span>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">表示</span>
        </div>
        <div class="range-row">
          <span class="range-label">不透明度</span>
          <input id="opacity-range" type="range" min="0.1" max="1" step="0.05" aria-label="点の不透明度" />
          <span id="opacity-val" class="range-val"></span>
        </div>
        <p id="count" class="count"></p>
        <p class="hint hint-sub" id="zoom-note"></p>
      </div>
    </div>

    <footer class="panel-foot">
      <strong>非公式</strong>のビューワです。出典:
      <a href="https://nlftp.mlit.go.jp/kokjo/inspect/landclassification/water/f9_exp.html" target="_blank" rel="noopener">国土交通省「土地分類調査・水基本調査 全国地下水資料台帳調査」</a>（2003年頃に配布されていた地域別シェープファイル／国立国会図書館 WARP 収集）<br />
      加工: <a href="https://github.com/shiwaku/mlit-groundwater-well-registry" target="_blank" rel="noopener">mlit-groundwater-well-registry</a><br />
      背景: 国土地理院 最適化ベクトルタイル／全国最新写真<br />
      <span id="build-ver" class="build-ver"></span>
    </footer>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
